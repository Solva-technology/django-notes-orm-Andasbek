{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Пользователи</h1>
<ul class="list-group">
  {% for u in users %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ u.name }}</strong><br>
        <small class="text-muted">{{ u.email }}</small>
      </div>
      <a class="btn btn-sm btn-primary" href="{% url 'users:user_detail' pk=u.pk %}">Открыть</a>
    </li>
  {% empty %}
    <li class="list-group-item text-muted">Пока нет пользователей</li>
  {% endfor %}
</ul>
{% endblock %}
