{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заметки{% endblock %}</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Ваш собственный файл стилей -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
<header class="py-3 mb-4 border-bottom bg-white shadow-sm">
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <a href="/" class="navbar-brand fw-bold">Notes</a>
    <nav class="nav gap-3">
      <a class="nav-link" href="/">Главная</a>
      <a class="nav-link" href="/users/">Пользователи</a>
    </nav>
  </div>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="mt-5 py-4 border-top text-muted">
  <div class="container small">© {% now "Y" %} Notes App</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
