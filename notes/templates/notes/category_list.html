{% extends 'base.html' %}

{% block title %}Категории | Заметки{% endblock %}

{% block content %}
<h1 class="mb-4">Категории заметок</h1>

<div class="row">
    {% for category in categories %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h3 class="card-title">{{ category.title }}</h3>
                    <p class="text-muted">Заметок: {{ category.notes.count }}</p>
                </div>
                <div class="card-footer bg-white border-top-0">
                    <a href="{% url 'notes:category_notes' category.id %}" class="btn btn-primary">Просмотреть заметки</a>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                Категорий пока нет.
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
